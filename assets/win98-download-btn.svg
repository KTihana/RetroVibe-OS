<svg xmlns="http://www.w3.org/2000/svg" width="310" height="54" viewBox="0 0 310 54" shape-rendering="crispEdges">
  <!-- Classic Win98 3D Raised Button -->
  <rect x="0" y="0" width="310" height="54" fill="#000000"/>
  <rect x="0" y="0" width="308" height="52" fill="#FFFFFF"/>
  <rect x="2" y="2" width="306" height="50" fill="#808080"/>
  <rect x="2" y="2" width="304" height="48" fill="#DFDFDF"/>
  <rect x="4" y="4" width="302" height="46" fill="#C0C0C0"/>

  <!-- Dotted Focus Ring -->
  <rect x="9" y="9" width="292" height="36" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Mini Pixel Floppy Disk Icon -->
  <rect x="24" y="16" width="20" height="20" fill="#111111"/>
  <rect x="26" y="18" width="16" height="16" fill="#2E5CB8"/>
  <rect x="29" y="18" width="10" height="6" fill="#FFFFFF"/>
  <rect x="35" y="19" width="2" height="4" fill="#111111"/>
  <rect x="28" y="27" width="12" height="7" fill="#E8E4DC"/>
  <rect x="30" y="29" width="8" height="1" fill="#E04068"/>
  <rect x="30" y="31" width="6" height="1" fill="#555555"/>

  <!-- Button Label -->
  <text x="56" y="32" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#000000">Download RetroVibe OS (.APK)</text>
</svg>
