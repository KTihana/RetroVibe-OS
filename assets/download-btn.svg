    <!-- Bold Main Label -->
    <text x="82" y="57" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="bold" fill="#24232B">Download RetroVibe OS</text>
    <text x="82" y="77" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#5F5B54">Latest Signed Android APK · Free</text>

    <!-- Prominent Raised Pastel-Pink Action Button -->
    <g transform="translate(362, 40)">
      <rect width="148" height="42" fill="url(#pillGrad)"/>
      <rect width="148" height="2.5" fill="#FFFFFF"/>
      <rect width="2.5" height="42" fill="#FFFFFF"/>
      <rect y="39.5" width="148" height="2.5" fill="#24232B"/>
      <rect x="145.5" width="2.5" height="42" fill="#24232B"/>
      <rect x="2.5" y="37" width="143" height="2.5" fill="#A84A6A"/>
      <rect x="143" y="2.5" width="2.5" height="37" fill="#A84A6A"/>
      <text x="15" y="26.5" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#24232B">▼ GET .APK</text>
    </g>
