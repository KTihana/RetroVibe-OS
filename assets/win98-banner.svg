<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" shape-rendering="crispEdges">
  <!-- Outer Win98 Window Frame -->
  <rect x="0" y="0" width="760" height="170" fill="#000000"/>
  <rect x="0" y="0" width="758" height="168" fill="#FFFFFF"/>
  <rect x="2" y="2" width="756" height="166" fill="#808080"/>
  <rect x="2" y="2" width="754" height="164" fill="#DFDFDF"/>
  <rect x="4" y="4" width="752" height="162" fill="#C0C0C0"/>

  <!-- Classic Win98 2-Tone Title Bar -->
  <defs>
    <linearGradient id="win98Title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#1084D0"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="746" height="28" fill="url(#win98Title)"/>

  <!-- Mini Pixel Window Flag -->
  <rect x="14" y="13" width="7" height="7" fill="#E04040" stroke="#111111" stroke-width="1"/>
  <rect x="22" y="13" width="7" height="7" fill="#40B048" stroke="#111111" stroke-width="1"/>
  <rect x="14" y="21" width="7" height="7" fill="#3070D8" stroke="#111111" stroke-width="1"/>
  <rect x="22" y="21" width="7" height="7" fill="#F0C830" stroke="#111111" stroke-width="1"/>

  <!-- Title Bar Text -->
  <text x="38" y="26" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">RetroVibe OS 98 - Welcome.exe</text>

  <!-- Minimize / Maximize / Close Buttons -->
  <!-- _ -->
  <rect x="688" y="11" width="18" height="18" fill="#000000"/>
  <rect x="688" y="11" width="17" height="17" fill="#FFFFFF"/>
  <rect x="689" y="12" width="16" height="16" fill="#808080"/>
  <rect x="689" y="12" width="15" height="15" fill="#C0C0C0"/>
  <rect x="692" y="22" width="8" height="2" fill="#000000"/>
  <!-- [] -->
  <rect x="708" y="11" width="18" height="18" fill="#000000"/>
  <rect x="708" y="11" width="17" height="17" fill="#FFFFFF"/>
  <rect x="709" y="12" width="16" height="16" fill="#808080"/>
  <rect x="709" y="12" width="15" height="15" fill="#C0C0C0"/>
  <rect x="712" y="15" width="9" height="8" fill="none" stroke="#000000" stroke-width="1.5"/>
  <rect x="712" y="15" width="9" height="2" fill="#000000"/>
  <!-- X -->
  <rect x="730" y="11" width="18" height="18" fill="#000000"/>
  <rect x="730" y="11" width="17" height="17" fill="#FFFFFF"/>
  <rect x="731" y="12" width="16" height="16" fill="#808080"/>
  <rect x="731" y="12" width="15" height="15" fill="#C0C0C0"/>
  <path d="M735 15 L743 23 M743 15 L735 23" stroke="#000000" stroke-width="2"/>

  <!-- Inner Teal Desktop Panel -->
  <rect x="12" y="42" width="736" height="114" fill="#FFFFFF"/>
  <rect x="12" y="42" width="734" height="112" fill="#808080"/>
  <rect x="14" y="44" width="732" height="110" fill="#008080"/>

  <!-- Headline -->
  <text x="380" y="92" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="34" font-weight="bold" fill="#000000">RetroVibe OS</text>
  <text x="378" y="90" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="34" font-weight="bold" fill="#FFFFFF">RetroVibe OS</text>

  <!-- Subtitle -->
  <text x="380" y="122" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#FFE8F0">A Windows 98 Desktop Experience for Android (Kotlin + Jetpack Compose)</text>

  <!-- Bottom Status Strip -->
  <rect x="14" y="136" width="732" height="18" fill="#C0C0C0"/>
  <line x1="14" y1="136" x2="746" y2="136" stroke="#FFFFFF" stroke-width="1"/>
  <text x="24" y="149" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">C:\RETROVIBE\  |  Ready</text>
  <text x="736" y="149" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" fill="#000000">v2.0.0</text>
</svg>
