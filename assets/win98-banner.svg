<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E4C89"/>
      <stop offset="100%" stop-color="#D99AA8"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Pastel Denim Desktop Wallpaper -->
  <rect width="820" height="230" fill="#789BC2"/>
  <rect width="820" height="230" fill="url(#scanlines)"/>

  <!-- Classic Win98 Outer Window Bevel -->
  <g transform="translate(26, 18)">
    <!-- Drop Shadow -->
    <rect x="6" y="6" width="768" height="190" fill="#24232B" fill-opacity="0.35"/>
    <!-- Window Body -->
    <rect width="768" height="190" fill="#ECE6DA"/>
    <!-- 3D Raised Bevel -->
    <rect width="768" height="3" fill="#FFFFFF"/>
    <rect width="3" height="190" fill="#FFFFFF"/>
    <rect y="187" width="768" height="3" fill="#24232B"/>
    <rect x="765" width="3" height="190" fill="#24232B"/>
    <rect x="3" y="184" width="762" height="3" fill="#8C867A"/>
    <rect x="762" y="3" width="3" height="184" fill="#8C867A"/>

    <!-- Gradient Title Bar -->
    <rect x="6" y="6" width="756" height="30" fill="url(#titleGrad)"/>

    <!-- Mini 4-pane Pastel Flag Icon -->
    <g transform="translate(14, 12)">
      <rect x="0" y="0" width="8" height="8" fill="#F07292" stroke="#101228" stroke-width="1.5"/>
      <rect x="10" y="1" width="8" height="8" fill="#72D498" stroke="#101228" stroke-width="1.5"/>
      <rect x="0" y="10" width="8" height="8" fill="#6496DC" stroke="#101228" stroke-width="1.5"/>
      <rect x="10" y="11" width="8" height="8" fill="#F8D258" stroke="#101228" stroke-width="1.5"/>
    </g>

    <text x="42" y="26" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">C:\RETROVIBE\WELCOME.EXE</text>

    <!-- Titlebar Buttons (_, [], X) -->
    <g transform="translate(692, 11)">
      <rect width="20" height="20" fill="#ECE6DA" stroke="#24232B" stroke-width="1.5"/>
      <rect x="1" y="1" width="17" height="2" fill="#FFFFFF"/>
      <text x="6" y="15" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#24232B">_</text>

      <rect x="23" width="20" height="20" fill="#ECE6DA" stroke="#24232B" stroke-width="1.5"/>
      <rect x="24" y="1" width="17" height="2" fill="#FFFFFF"/>
      <rect x="28" y="6" width="10" height="9" fill="none" stroke="#24232B" stroke-width="1.8"/>

      <rect x="46" width="20" height="20" fill="#ECE6DA" stroke="#24232B" stroke-width="1.5"/>
      <rect x="47" y="1" width="17" height="2" fill="#FFFFFF"/>
      <text x="51" y="15" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#24232B">×</text>
    </g>

    <!-- Inner Sunken Cream Panel -->
    <rect x="14" y="46" width="740" height="130" fill="#F8F5EF"/>
    <rect x="14" y="46" width="740" height="2" fill="#8C867A"/>
    <rect x="14" y="46" width="2" height="130" fill="#8C867A"/>
    <rect x="14" y="174" width="740" height="2" fill="#FFFFFF"/>
    <rect x="752" y="46" width="2" height="130" fill="#FFFFFF"/>

    <!-- Mini Pixel Floppy Disk Emblem on Left -->
    <g transform="translate(36, 62)">
      <rect x="0" y="0" width="84" height="84" rx="4" fill="#6486C8" stroke="#101228" stroke-width="4"/>
      <rect x="24" y="2" width="38" height="30" fill="#D2DCE6" stroke="#101228" stroke-width="3"/>
      <rect x="44" y="8" width="12" height="18" fill="#6486C8" stroke="#101228" stroke-width="2.5"/>
      <rect x="14" y="42" width="56" height="40" fill="#FFF7DC" stroke="#101228" stroke-width="3"/>
      <rect x="16" y="58" width="52" height="22" fill="#F0728C"/>
      <!-- Tiny Heart on Floppy -->
      <rect x="36" y="46" width="5" height="5" fill="#E84874"/>
      <rect x="43" y="46" width="5" height="5" fill="#E84874"/>
      <rect x="36" y="49" width="12" height="4" fill="#E84874"/>
      <rect x="39" y="53" width="6" height="3" fill="#E84874"/>
    </g>

    <!-- Main Title & Tagline -->
    <text x="148" y="102" font-family="'Courier New', Courier, monospace" font-size="42" font-weight="bold" fill="#2E4C89" letter-spacing="1">RetroVibe OS</text>
    <text x="150" y="128" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#5F5B54">A cozy Windows 98 desktop simulator built natively for Android.</text>

    <!-- Cute Status Chips -->
    <g transform="translate(150, 142)">
      <rect width="124" height="22" fill="#F6D6DF" stroke="#24232B" stroke-width="1.5"/>
      <text x="10" y="15" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#24232B">Kotlin + Compose</text>

      <rect x="132" width="114" height="22" fill="#ECE6DA" stroke="#24232B" stroke-width="1.5"/>
      <text x="142" y="15" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#24232B">32x32 Pixel Art</text>

      <rect x="254" width="136" height="22" fill="#ECE6DA" stroke="#24232B" stroke-width="1.5"/>
      <text x="264" y="15" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#24232B">Mindi &amp; Spooks</text>

      <rect x="398" width="124" height="22" fill="#ECE6DA" stroke="#24232B" stroke-width="1.5"/>
      <text x="408" y="15" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#24232B">In-App Updates</text>
    </g>
  </g>
</svg>
