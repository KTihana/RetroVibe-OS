name: Build & Release RetroVibe OS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RETROVIBE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/retrovibe-release.jks"
            echo "RETROVIBE_KEYSTORE_PATH=$RUNNER_TEMP/retrovibe-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release APK
        env:
          RETROVIBE_STORE_PASS: ${{ secrets.RETROVIBE_STORE_PASS }}
          RETROVIBE_KEY_ALIAS: ${{ secrets.RETROVIBE_KEY_ALIAS }}
          RETROVIBE_KEY_PASS: ${{ secrets.RETROVIBE_KEY_PASS }}
        run: |
          if [ -n "$RETROVIBE_KEYSTORE_PATH" ]; then
            gradle assembleRelease -PbuildNum=${{ github.run_number }}
            cp app/build/outputs/apk/release/app-release.apk RetroVibe-OS.apk
          else
            gradle assembleDebug -PbuildNum=${{ github.run_number }}
            cp app/build/outputs/apk/debug/app-debug.apk RetroVibe-OS.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroVibe-OS-APK
          path: RetroVibe-OS.apk

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: RetroVibe OS v2.0.${{ github.run_number }}
          body: |
            RetroVibe OS 98 for Android (v2.0.${{ github.run_number }}).

            Latest changes: ${{ github.event.head_commit.message }}

            Tap **RetroVibe-OS.apk** below to install or update in place!
          files: RetroVibe-OS.apk
          make_latest: true
