name: Build & Release RetroVibe OS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RetroVibe-OS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroVibe-OS-APK
          path: RetroVibe-OS.apk

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: RetroVibe OS v2.0.0
          body: "RetroVibe OS 98 for Android. Tap RetroVibe-OS.apk below to install."
          files: RetroVibe-OS.apk
          make_latest: true
